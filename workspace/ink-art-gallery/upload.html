<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작품 업로드 - 인크 아트 갤러리</title>
    <link rel="stylesheet" href="css/upload-style.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="upload-header">
            <h1 id="site-title">인크 아트 갤러리</h1>
            <p id="subtitle">작품 업로드 및 관리</p>
        </header>

        <!-- 네비게이션 -->
        <nav class="navigation">
            <a href="index.html" class="nav-link">메인 페이지</a>
            <a href="upload.html" class="nav-link active">작품 업로드</a>
        </nav>

        <!-- 메인 콘텐츠 -->
        <main class="main-content">
            <!-- 설정 섹션 -->
            <section class="settings-section">
                <h2>사이트 설정</h2>
                
                <div class="form-group">
                    <label for="site-title-input">사이트 제목</label>
                    <input type="text" id="site-title-input" placeholder="사이트 제목을 입력하세요">
                </div>

                <div class="form-group">
                    <label for="subtitle-input">서브타이틀</label>
                    <input type="text" id="subtitle-input" placeholder="서브타이틀을 입력하세요">
                </div>

                <!-- 환영 메시지 설정 -->
                <hr style="margin: 30px 0; border: none; border-top: 1px solid #000;">
                
                <h2>환영 메시지 설정</h2>
                
                <div class="form-group">
                    <label for="welcome-title-input">환영 메시지 제목</label>
                    <input type="text" id="welcome-title-input" placeholder="환영 메시지 제목을 입력하세요">
                </div>

                <div class="form-group">
                    <label for="welcome-text-input">환영 메시지 본문</label>
                    <textarea id="welcome-text-input" rows="3" placeholder="환영 메시지를 입력하세요"></textarea>
                </div>

                <div class="form-group">
                    <label for="welcome-subtext-input">환영 메시지 서브텍스트</label>
                    <input type="text" id="welcome-subtext-input" placeholder="환영 메시지 추가 내용을 입력하세요">
                </div>

                <hr style="margin: 30px 0; border: none; border-top: 1px solid #000;">
                
                <!-- 카테고리 설정 -->
                <h2>카테고리 관리</h2>
                
                <div class="form-group">
                    <label for="category-count-input">카테고리 개수</label>
                    <input type="number" id="category-count-input" min="1" max="50" value="1">
                </div>

                <!-- 카테고리 이름 입력 컨테이너 -->
                <div id="category-name-container" class="form-group category-names-container">
                    <!-- 카테고리 이름 입력 필드가 여기에 표시됩니다 -->
                </div>

                <!-- 카테고리 추가 버튼 -->
                <button type="button" onclick="addCategoryNameInput()" class="btn btn-secondary">+ 카테고리 추가</button>
                
                <!-- 사이트 설정 저장 버튼 -->
                <hr style="margin: 30px 0; border: none; border-top: 1px solid #000;">
                
                <button type="button" onclick="saveSiteSettings()" class="btn btn-primary">사이트 설정 저장</button>
            </section>

            <hr style="margin: 40px 0; border: none; border-top: 1px solid #000;">

            <!-- 작품 업로드 섹션 -->
            <section class="upload-section">
                <h2>작품 업로드</h2>

                <div class="form-group">
                    <label for="work-image-input">작품 이미지</label>
                    <input type="file" id="work-image-input" accept="image/*">
                </div>

                <div class="form-group">
                    <label for="work-title-input">작품 제목</label>
                    <input type="text" id="work-title-input" placeholder="작품 제목을 입력하세요">
                </div>

                <div class="form-group">
                    <label for="work-description-input">작품 설명</label>
                    <textarea id="work-description-input" rows="5" placeholder="작품에 대한 설명을 입력하세요"></textarea>
                </div>

                <div class="form-group">
                    <label for="work-category-select">카테고리 선택</label>
                    <select id="work-category-select">
                        <!-- 카테고리 목록이 여기에 표시됩니다 -->
                    </select>
                </div>

                <hr style="margin: 30px 0; border: none; border-top: 1px solid #000;">

                <h2>작품 편집</h2>

                <p class="hint-text">이미 업로드된 작품을 선택하여 수정하거나 삭제할 수 있습니다.</p>

                <div id="works-list" class="works-list">
                    <!-- 작품 목록이 여기에 표시됩니다 -->
                </div>

                <button type="button" onclick="saveWorks()" class="btn btn-primary">작품 저장</button>
            </section>
        </main>

        <!-- 푸터 -->
        <footer class="upload-footer">
            <p>&copy; 2026 인크 아트 갤러리</p>
        </footer>
    </div>

    <script src="js/upload.js"></script>
</body>
</html>
